name: dirsha_admin
description: "Dirsha — Flutter Web Admin Dashboard. Phase 1 prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # HTTP client for API integration
  http: ^1.2.2

  # Shared preferences for local session storage (token only, no secrets)
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
