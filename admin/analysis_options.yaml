# Analysis options for Dirsha Admin Dashboard
# See https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**

linter:
  rules:
    # These two info-level rules produce noisy but harmless suggestions
    # in this codebase's constructor patterns and GoRouter builder lambdas.
    prefer_initializing_formals: false
    unnecessary_underscores: false
    no_leading_underscores_for_local_identifiers: false
    unintended_html_in_doc_comment: false
